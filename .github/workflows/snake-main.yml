name: Snake Animation

on:
  # Runs every 6 hours
  schedule:
    - cron: "0 */6 * * *"
    
  # Run manually  
  workflow_dispatch:
  
  # Run on push to main
  push:
    branches: [ main, master ]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # generates a snake game from a github user contributions graph and outputs a svg animation at <svg_out_path>
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayanalamMOON
          outputs: dist/snake.svg
          
      - name: Generate dark snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayanalamMOON
          outputs: dist/snake-dark.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dark_mode: true
          
      - name: Generate light snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayanalamMOON
          outputs: dist/snake-light.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}
          light_mode: true

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/ayanalamMOON/ayanalamMOON/output/snake.svg
      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
