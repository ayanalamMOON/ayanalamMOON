name: Test Snake Generation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test snake generation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayanalamMOON
          outputs: |
            test/snake.svg
            test/snake-dark.svg?palette=github-dark
            test/snake-light.svg?palette=github-light
            
      - name: List generated files
        run: |
          echo "Generated files:"
          ls -la test/
          
      - name: Show file sizes
        run: |
          echo "File sizes:"
          du -h test/*
          
      - name: Verify SVG content
        run: |
          echo "Checking if files contain valid SVG content:"
          head -n 5 test/snake.svg
          echo "---"
          grep -q "<svg" test/snake.svg && echo "✅ snake.svg is valid" || echo "❌ snake.svg is invalid"
          grep -q "<svg" test/snake-dark.svg && echo "✅ snake-dark.svg is valid" || echo "❌ snake-dark.svg is invalid"
          grep -q "<svg" test/snake-light.svg && echo "✅ snake-light.svg is valid" || echo "❌ snake-light.svg is invalid"
