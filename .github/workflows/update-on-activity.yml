name: Update Projects on Activity

on:
  push:
    branches: [ main, master, develop ]
  repository_dispatch:
    types: [project-update]
  workflow_dispatch: # Allow manual trigger

jobs:
  update-on-activity:
    runs-on: ubuntu-latest
    if: github.repository == 'ayanalamMOON/ayanalamMOON'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dateutil

    - name: Update README with current projects
      run: |
        python .github/scripts/update_projects.py

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "🤖 Auto-update: Current projects refreshed"
        git push
